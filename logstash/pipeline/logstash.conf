input {
	beats {
		port => 5044
	}
	file {
    path => "/usr/share/logstash/dataset/*.csv"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    }
	tcp {
		port => 50000
	}
}
filter {
  # NẾU LÀ DỮ LIỆU TỪ FILEBEAT (JSON)
  if [agent][type] == "filebeat" or [type] == "zeek" {
    json {
      source => "message"
    }
  } 
  # NẾU LÀ DỮ LIỆU CSV
  else {
    csv {
      separator => ","
      autodetect_column_names => true
      skip_header => true
    }
    mutate {
      convert => { "Label" => "integer" }
    }
  }
}
  
  # Ép kiểu dữ liệu (rất quan trọng để sau này kéo data về Python đưa vào mô hình LSTM)
  mutate {
    convert => {
      "Label" => "integer"
      # Bạn có thể thêm các cột khác cần ép kiểu số ở đây (ví dụ: spkts, dpkts, sbytes, dbytes...)
    }
    # Bỏ đi các trường rác do Logstash tự sinh ra để giảm nhẹ dung lượng
    remove_field => ["@version", "host", "message", "event"]
  }
}

## Add your filters / logstash plugins configuration here

output {
	elasticsearch {
		hosts => "elasticsearch:9200"
		user => "elastic"                             # <-- ĐỔI THÀNH elastic
    password => "changeme"             # <-- ĐỔI THÀNH ${ELASTIC_PASSWORD}
		index => "unsw-raw"
	}
	stdout { codec => rubydebug }
}
